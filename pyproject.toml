[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphtrace"
version = "0.1.0"
description = "Regression testing for LangGraph agents, as a pytest plugin."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Anoop Singh" }]
# Dependencies are added as the code that needs them gets built, not up front.
# langgraph/langchain-core landed the week frameworks/langgraph/ did; litellm,
# pydantic, ruamel.yaml etc. will each show up the same way, the same week the
# module that imports them does.
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
    "ruamel.yaml>=0.18,<0.19",
    "pydantic>=2,<3",
    "litellm>=1.50,<2",
    "scikit-learn>=1.5,<2",
    "jinja2>=3.1,<4",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "python-dotenv>=1.0,<2",
    # Not graphtrace's own dependency -- a real, pinned external app
    # (langchain-ai's own official multi-agent library) kept as a permanent
    # compatibility test, gated with pytest.importorskip. Testing against
    # its real API (not a hand-approximated stand-in) is what found three
    # real bugs no synthetic demo agent ever would have -- see
    # frameworks/langgraph/{interceptors,recorder}.py's own docstrings.
    "langgraph-swarm>=0.1,<1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.entry-points.pytest11]
graphtrace = "graphtrace.plugin"

[project.scripts]
graphtrace = "graphtrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graphtrace"]

[tool.pytest.ini_options]
# Lets tests/ import the demo agent (`from refund_agent.graph import
# build_refund_graph`) without examples/ being an installed package -- it's example
# code a user reads and copies, not something graphtrace itself ships or depends on.
pythonpath = ["examples"]
# Without this, a bare `pytest` from the repo root also collects
# examples/sample_trace/test_refund_sample.py (a checked-in, already-generated
# sample, meant to be run explicitly as documentation -- see its own README) --
# confirmed by hand that it silently joined the main count the moment that
# sample was added. The project's own regression suite is tests/, full stop.
testpaths = ["tests"]
