name: Publish to PyPI

# Builds and uploads a release to PyPI via Trusted Publishing (OIDC) -- no
# API token stored as a repo secret. Fires only when a GitHub Release is
# published, so a publish is always a deliberate, visible action, never an
# accidental side effect of a normal push to main.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
