site_name: graphtrace
site_description: Regression testing for LangGraph agents, as a pytest plugin.
repo_name: graphtrace
repo_url: https://github.com/devbyanoop/graphtrace
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guide:
      - "Core concepts: Trajectory & Step": guide/trajectory-model.md
      - Assertions: guide/assertions.md
      - Recording & replay: guide/recording-and-replay.md
      - "Cut-point replay (v0.2)": guide/cut-point-replay.md
      - Judge & calibration: guide/judge-and-calibration.md
      - Trace-to-test: guide/trace-to-test.md
      - Configuration: guide/configuration.md
      - Report & CI: guide/report-and-ci.md
      - "Security test pack (v0.2)": guide/security-test-pack.md
      - "Observability export (v0.2)": guide/observability-export.md
      - "Multi-framework support (v0.4)": guide/multi-framework.md
  - Reference:
      - CLI: reference/cli.md
  - Project:
      - Roadmap & status: project/roadmap.md
      - FAQ: project/faq.md
      - Contributing: project/contributing.md
      - Changelog: project/changelog.md
